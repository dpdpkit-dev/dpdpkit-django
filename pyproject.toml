[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dpdpkit-django"
dynamic = ["version"]
description = "Django app for dpdpkit: DPDP consent, notices, rights requests, retention and an admin request queue."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dpdpkit maintainers" }]
keywords = ["dpdp", "django", "privacy", "consent", "india"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "dpdpkit-core>=0.1.0a1,<0.2",
  "django>=4.2",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
celery = ["celery>=5.3"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["mysqlclient>=2.2"]
dev = [
  "djangorestframework>=3.14",
  "djangorestframework-stubs>=3.14",
  "pytest>=8",
  "pytest-django>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs>=5",
]

[project.urls]
Homepage = "https://github.com/dpdpkit-dev/dpdpkit-django"
Documentation = "https://dpdpkit-dev.github.io/dpdpkit-docs/dev/"
Changelog = "https://github.com/dpdpkit-dev/dpdpkit-django/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dpdpkit/django/__init__.py"

# Ships only dpdpkit/django/; dpdpkit/__init__.py belongs to dpdpkit-core.
[tool.hatch.build.targets.wheel]
only-include = ["src/dpdpkit/django"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/dpdpkit/django", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django reads Meta and Migration attributes as plain lists.
"src/dpdpkit/django/models.py" = ["RUF012"]
"src/dpdpkit/django/migrations/*.py" = ["RUF012"]

"examples/*/school/migrations/*.py" = ["RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["dpdpkit", "school"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
